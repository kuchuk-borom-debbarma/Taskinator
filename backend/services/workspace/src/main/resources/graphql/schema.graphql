# Federation 2.0 Setup: This imports the necessary 'stickers' (@key, @external) 
# that allow different microservices to talk to each other.
extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.0",
        import: ["@key", "@shareable", "@external"])

type Query {
    project(id: ID!): Project
    team(id: ID!): Team
}

# --- EXTENSIONS ---
# We do NOT own the User (Identity Service does). 
# We are "plugging in" our data into their object.
type User @key(fields: "id") {
    id: ID! @external # This field is owned by Identity Service
    
    # We provide this field! The Gateway will ask us to fill this
    # whenever someone queries a User.
    projects(limit: Int = 10, offset: Int = 0): [Project!]!
}

# --- CORE TYPES ---

# @key means other services can "lookup" a Project if they have its ID.
type Project @key(fields: "id") {
    id: ID!
    name: String! @shareable
    
    # This points back to the User in Identity Service.
    # We return the ID, and the Gateway fetches the rest.
    owner: User! 
    
    description: String
    createdAt: String!
    updatedAt: String
    
    # Nested relationships within this service
    teams(limit: Int = 10, offset: Int = 0): [Team!]!
    members(limit: Int = 10, offset: Int = 0): [ProjectMember!]!
}

# Joining Project to User
type ProjectMember {
    user: User!
    createdAt: String!
}

type Team @key(fields: "id") {
    id: ID!
    name: String!
    projectId: ID!
    parentTeamId: ID
    createdAt: String!
    members(limit: Int = 10, offset: Int = 0): [TeamMember!]!
}

# Joining Team to User
type TeamMember {
    user: User!
    createdAt: String!
}