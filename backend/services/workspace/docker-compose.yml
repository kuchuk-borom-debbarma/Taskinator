services:
  taskinator-workspace-isolated-db:
    image: postgres:17-alpine
    container_name: taskinator-workspace-isolated-db
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d workspace"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
