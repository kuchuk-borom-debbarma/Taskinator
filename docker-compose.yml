services:
  workspace-db:
    image: postgres:17-alpine
    container_name: taskinator-workspace-db
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d workspace"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - workspace_data:/var/lib/postgresql/data

  identity-db:
    image: postgres:17-alpine
    container_name: taskinator-identity-db
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Mapped to 5433 on host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d identity"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - identity_data:/var/lib/postgresql/data

volumes:
  workspace_data:
  identity_data:
