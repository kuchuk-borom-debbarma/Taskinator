services:
  taskinator-kafka:
    image: apache/kafka:latest # Using the official Apache image
    ports:
      - "9092:9092"
    environment:
      # --- KRaft Mode (Apache Kafka Official) ---
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@taskinator-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      
      # --- Network Listeners ---
      - KAFKA_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://taskinator-kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      
      # --- Security & Misc ---
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=taskinator-kafka:29092
    depends_on:
      - taskinator-kafka

  workspace-db:
    image: postgres:17-alpine
    container_name: taskinator-workspace-db
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d workspace"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - workspace_data:/var/lib/postgresql/data

  identity-db:
    image: postgres:17-alpine
    container_name: taskinator-identity-db
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d identity"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - identity_data:/var/lib/postgresql/data

volumes:
  workspace_data:
  identity_data:
  kafka_data: