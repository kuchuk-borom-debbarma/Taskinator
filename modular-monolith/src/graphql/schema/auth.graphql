type User {
    id: ID!
    username: String!
    email: String!

    # Relational Connections (Universal Expansion)
    projects(first: Int, after: String, last: Int, before: String): ProjectConnection!
    teams(first: Int, after: String, last: Int, before: String): TeamConnection!
    assignedTasks(first: Int, after: String, last: Int, before: String): ProjectTaskConnection!
}

type UserSearchResultEdge {
    node: User!
    cursor: String!
}

type UserSearchResultConnection {
    edges: [UserSearchResultEdge!]!
    pageInfo: PageInfo!
}

extend type Query {
    me: User
    searchUsers(
        search: String
        first: Int
        after: String
        last: Int
        before: String
    ): UserSearchResultConnection!
    searchTeamUsers(
        projectId: ID!
        teamId: ID!
        search: String
        first: Int
        after: String
        last: Int
        before: String
    ): UserSearchResultConnection!
}
