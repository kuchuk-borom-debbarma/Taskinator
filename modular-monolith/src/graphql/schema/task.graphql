type Task {
  id: ID!
  title: String!
  description: String
  status: String!
  projectId: ID!
  project: Project
  teamId: ID
  team: Team
  memberId: ID
  assignee: User
  parentTaskId: ID
  materializedPath: String!
  createdBy: String!
  creator: User
  createdAt: String!
  updatedAt: String
  version: Int!
  automations: [AutomationRule!]!
}

type TaskEdge {
  node: Task!
  cursor: String!
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
}



union TaskEvent = TaskCreated | TaskUpdated | TaskDeleted

type TaskCreated {
  task: Task!
}

type TaskUpdated {
  task: Task!
}

type TaskDeleted {
  id: ID!
  projectId: ID!
}

input UpdateTaskInput {
  id: ID!
  version: Int!
  status: String
  title: String
  description: String
  teamId: ID
  memberId: ID
  parentTaskId: ID
}

extend type Query {
  tasks(projectId: ID!, first: Int, after: String): TaskConnection!
}

extend type Mutation {
  createTask(projectId: ID!, title: String!, description: String!, teamId: ID, parentTaskId: ID): Task
  updateTasks(projectId: ID!, tasks: [UpdateTaskInput!]!): [ID]
  deleteTasks(projectId: ID!, taskIds: [ID!]!): [ID]
}


