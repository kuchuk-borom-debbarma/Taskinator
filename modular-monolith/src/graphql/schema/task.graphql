type TaskLink {
  id: ID!
  projectId: ID!
  sourceTaskId: ID!
  targetTaskId: ID!
  label: String!
  createdBy: ID!
  createdAt: String!

  # Resolved via DataLoader
  sourceTask: ProjectTask
  targetTask: ProjectTask
}

type TaskLinkEdge {
  node: TaskLink!
  cursor: String!
}

type TaskLinkConnection {
  edges: [TaskLinkEdge!]!
  pageInfo: PageInfo!
}

enum NeighbourDirection {
  incoming
  outgoing
  both
}

type NeighbourhoodNode {
  # The actual task data (hydrated via DataLoader)
  task: ProjectTask!

  # Depth from the focused task (1 = direct, 2 = one hop away, etc.)
  depth: Int!

  # Which side of the focused task this node sits on
  direction: NeighbourDirection!
}

type NeighbourhoodNodeEdge {
  node: NeighbourhoodNode!
  cursor: String!
}

type NeighbourhoodNodeConnection {
  edges: [NeighbourhoodNodeEdge!]!
  pageInfo: PageInfo!
}

type TaskNeighbourhood {
  # Always the root/centre — NOT in nodes
  focusedTask: ProjectTask!

  # Arranged nodes, ordered by (depth ASC, direction) — server does the work
  nodes(first: Int, after: String, last: Int, before: String): NeighbourhoodNodeConnection!

  # Direct links between any two nodes in {focusedTask} ∪ {nodes}
  edges(first: Int, after: String, last: Int, before: String): TaskLinkConnection!

  pageInfo: PageInfo!
}

type ProjectTask {
  id: ID!
  projectId: ID!
  teamId: ID # Needs to resolve to team
  memberId: ID # Needs to resovlve to user
  title: String!
  description: String!
  status: String!
  priority: Int!
  dueDate: String
  version: Int!
  lastEventId: ID # 
  createdBy: ID! # Needs to resolve to user
  updatedBy: ID! # Needs to resolve to user
  createdAt: String!
  updatedAt: String!
  parentRef: String
  order: Int

  incomingLinksCount: Int!
  outgoingLinksCount: Int!
  directIncomingLinksCount: Int!
  directOutgoingLinksCount: Int!
  incomingLabelCounts: String!
  outgoingLabelCounts: String!

  # Resolved fields
  project: Project
  team: Team
  member: User
  assignee: User
  creator: User
  updater: User

  # Direct incoming/outgoing edges (depth-1 only)
  incomingLinks(first: Int, after: String, last: Int, before: String): TaskLinkConnection!
  outgoingLinks(first: Int, after: String, last: Int, before: String): TaskLinkConnection!
}

type ProjectTaskEdge {
  node: ProjectTask!
  cursor: String!
}

type ProjectTaskConnection {
  edges: [ProjectTaskEdge!]!
  pageInfo: PageInfo!
}

extend type Query {
  projectTasks(
    projectId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): ProjectTaskConnection!

  task(id: ID!): ProjectTask

  taskNeighbourhood(
    projectId: ID!
    taskId: ID!
    maxDepth: Int
    first: Int
    after: String
    last: Int
    before: String
  ): TaskNeighbourhood!

  # Returns all direct task_link edges in a project (for list view dependency chips)
  projectTaskLinks(projectId: ID!, first: Int, after: String, last: Int, before: String): TaskLinkConnection!
}

extend type Mutation {
  createTask(
    projectId: ID!
    teamId: ID
    memberId: ID
    title: String!
    description: String
    status: String
  ): ProjectTask!

  updateTask(
    taskId: ID!
    title: String
    description: String
    status: String
  ): ProjectTask!

  deleteTask(taskId: ID!): ID!

  createTaskLink(
    projectId: ID!
    sourceTaskId: ID!
    targetTaskId: ID!
    label: String!
  ): TaskLink!

  deleteTaskLink(linkId: ID!): ID!
}
