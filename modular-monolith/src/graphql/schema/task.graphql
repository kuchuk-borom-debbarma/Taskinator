type Task {
    id: ID!
    title: String!
    description: String
    status: String!
    projectId: ID!
    project: Project
    teamId: ID
    team: Team
    memberId: ID
    assignee: User
    createdBy: String!
    creator: User
    createdAt: String!
    updatedAt: String
    version: Int!
    automations: [AutomationRule!]!
    links: [TaskLink!]!
    story: [TaskStory!]!
}

type TaskLink {
    id: ID!
    sourceTaskId: ID!
    targetTaskId: ID!
    label: String!
    sourceTask: Task
    targetTask: Task
    fromTaskId: ID!
    toTaskId: ID!
    toTask: Task
    type: String!
    createdBy: String!
    createdAt: String!
}

type TaskStory {
    id: ID!
    originTaskId: ID!
    terminalTaskId: ID!
    originId: ID!
    terminalId: ID!
    pathTaskIds: [ID!]!
    pathLinkIds: [ID!]!
    pathLinkLabels: [String!]!
    pathLinkTypes: [String!]!
    pathTasks: [Task!]!
    depth: Int!
    createdAt: String!
}

type TaskNetwork {
    incoming: [TaskStory!]!
    outgoing: [TaskStory!]!
}

type TaskEdge {
    node: Task!
    cursor: String!
}

type TaskConnection {
    edges: [TaskEdge!]!
    pageInfo: PageInfo!
}

union TaskEvent = TaskCreated | TaskUpdated | TaskDeleted

type TaskCreated {
    task: Task!
}

type TaskUpdated {
    task: Task!
}

type TaskDeleted {
    id: ID!
    projectId: ID!
}

input UpdateTaskInput {
    id: ID!
    version: Int!
    status: String
    title: String
    description: String
    teamId: ID
    memberId: ID
}

extend type Query {
    task(projectId: ID!, id: ID!): Task
    tasks(projectId: ID!, first: Int, after: String, last: Int, before: String): TaskConnection!
    taskNetwork(projectId: ID!, taskId: ID!, depth: Int = 3, limit: Int = 20): TaskNetwork!
}

extend type Mutation {
    createTask(
        projectId: ID!
        title: String!
        description: String!
        teamId: ID
    ): Task
    updateTasks(projectId: ID!, tasks: [UpdateTaskInput!]!): [ID]
    deleteTasks(projectId: ID!, taskIds: [ID!]!): [ID]

    createTaskLink(
        projectId: ID!
        sourceTaskId: ID
        targetTaskId: ID
        label: String
        fromTaskId: ID
        toTaskId: ID
        linkType: String
    ): ID
    deleteTaskLink(projectId: ID!, linkId: ID!): Boolean
}
