type TaskLink {
  id: ID!
  projectId: ID!
  sourceTaskId: ID!
  targetTaskId: ID!
  label: String!
  createdBy: ID!
  createdAt: String!

  # Resolved via DataLoader
  sourceTask: ProjectTask
  targetTask: ProjectTask
}

type TaskLinkEdge {
  node: TaskLink!
  cursor: String!
}

type TaskLinkConnection {
  edges: [TaskLinkEdge!]!
  pageInfo: PageInfo!
}

type ProjectTask {
  id: ID!
  projectId: ID!
  teamId: ID
  memberId: ID
  title: String!
  description: String!
  status: String!
  version: Int!
  lastEventId: ID
  createdBy: ID!
  updatedBy: ID!
  createdAt: String!
  updatedAt: String!

  # Resolved fields
  project: Project
  team: Team

  # Direct incoming/outgoing edges (depth-1 only)
  incomingLinks(first: Int, after: String, last: Int, before: String): TaskLinkConnection!
  outgoingLinks(first: Int, after: String, last: Int, before: String): TaskLinkConnection!
}

type ProjectTaskEdge {
  node: ProjectTask!
  cursor: String!
}

type ProjectTaskConnection {
  edges: [ProjectTaskEdge!]!
  pageInfo: PageInfo!
}

extend type Query {
  projectTasks(
    projectId: ID!
    first: Int
    after: String
    last: Int
    before: String
  ): ProjectTaskConnection!

  task(id: ID!): ProjectTask
}

extend type Mutation {
  createTask(
    projectId: ID!
    teamId: ID
    memberId: ID
    title: String!
    description: String
    status: String
  ): ProjectTask!

  deleteTask(taskId: ID!): ID!
}
