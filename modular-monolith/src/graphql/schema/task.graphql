type Task {
  id: ID!
  title: String!
  description: String
  status: String!
  projectId: ID!
  project: Project
  teamId: ID
  team: Team
  memberId: ID
  assignee: User
  parentTaskId: ID
  materializedPath: String!
  createdBy: String!
  creator: User
  createdAt: String!
  updatedAt: String
  version: Int!
}

type TaskEdge {
  node: Task!
  cursor: String!
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
}

type AutomationRule {
  id: ID!
  projectId: ID!
  actorId: String!
  targetScope: String!
  taskId: ID
  teamId: ID
  rules: String!
  isActive: Boolean!
  createdAt: String!
  updatedAt: String
}

type AutomationRuleEdge {
  node: AutomationRule!
  cursor: String!
}

type AutomationRuleConnection {
  edges: [AutomationRuleEdge!]!
  pageInfo: PageInfo!
}

union TaskEvent = TaskCreated | TaskUpdated | TaskDeleted

type TaskCreated {
  task: Task!
}

type TaskUpdated {
  task: Task!
}

type TaskDeleted {
  id: ID!
  projectId: ID!
}

input UpdateTaskInput {
  id: ID!
  version: Int!
  status: String
  title: String
  description: String
  teamId: ID
  memberId: ID
  parentTaskId: ID
}

extend type Query {
  tasks(projectId: ID!, first: Int, after: String): TaskConnection!
  automations(projectId: ID, actorId: ID, taskId: ID, teamId: ID, targetScope: String, first: Int, after: String): AutomationRuleConnection!
}

extend type Mutation {
  createTask(projectId: ID!, title: String!, description: String!, teamId: ID, parentTaskId: ID): Task
  updateTasks(projectId: ID!, tasks: [UpdateTaskInput!]!): [ID]
  deleteTasks(projectId: ID!, taskIds: [ID!]!): [ID]
  addAutomation(projectId: ID!, targetScope: String!, taskId: ID, teamId: ID, rules: String!, isActive: Boolean): AutomationRule
  updateAutomation(automationId: ID!, targetScope: String, taskId: ID, teamId: ID, rules: String, isActive: Boolean): AutomationRule
  deleteAutomation(automationId: ID!): Boolean
}


