type Project {
    id: ID!
    name: String!
    description: String
    userId: String!
    creator: User
    isOwner: Boolean
    createdAt: String!
    updatedAt: String
    version: Int!

    # Aggregate Data
    teamCount: Int!
    taskCount: Int!
    memberCount: Int!
    taskLabelCounts: [TaskLabelCount!]!

    # Connections
    teams(first: Int, after: String, last: Int, before: String): TeamConnection!
    tasks(first: Int, after: String, last: Int, before: String): ProjectTaskConnection!
    members(first: Int, after: String, last: Int, before: String): ProjectMemberConnection!
    
    # Personal Context
    myTeams(first: Int, after: String, last: Int, before: String): TeamConnection!
    myTasks(first: Int, after: String, last: Int, before: String): ProjectTaskConnection!
}

type ProjectEdge {
    node: Project!
    cursor: String!
}

type ProjectConnection {
    edges: [ProjectEdge!]!
    pageInfo: PageInfo!
    totalCount: Int
}

type ProjectMember {
    id: ID!
    projectId: ID!
    userId: String!
    user: User
    project: Project
    createdAt: String!
    version: Int!

    # Personal Backlog
    assignedTasks(first: Int, after: String, last: Int, before: String): ProjectTaskConnection!
}

type ProjectMemberEdge {
    node: ProjectMember!
    cursor: String!
}

type ProjectMemberConnection {
    edges: [ProjectMemberEdge!]!
    pageInfo: PageInfo!
}

extend type Query {
    projects(first: Int, after: String, last: Int, before: String): ProjectConnection!
    project(id: ID!): Project
    projectMembers(
        projectId: ID!
        first: Int
        after: String
        last: Int
        before: String
    ): ProjectMemberConnection!
    workspaceStats: WorkspaceStats!
}

type WorkspaceStats {
    projectCount: Int!
    teamCount: Int!
    assignedTaskCount: Int!
}

extend type Mutation {
    createProject(name: String!, description: String): Project
    updateProject(id: ID!, name: String, description: String): Project
    deleteProjects(projectIds: [ID!]!): DeleteProjectsPayload
    addProjectMembers(projectId: ID!, userIds: [String!]!): AddProjectMembersPayload
    removeProjectMembers(projectId: ID!, memberIds: [ID!]!): RemoveProjectMembersPayload
}

type AddProjectMembersPayload {
    success: Boolean!
    project: Project
}

type RemoveProjectMembersPayload {
    success: Boolean!
    removedCount: Int!
    project: Project
}

type DeleteProjectsPayload {
    success: Boolean!
    deletedCount: Int!
}
