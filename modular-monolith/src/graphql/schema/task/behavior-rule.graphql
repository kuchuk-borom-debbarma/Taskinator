enum BehaviorCategory {
    GUARD
    CASCADE
    AUTOMATION
}

enum BehaviorType {
    BLOCKER_RESOLUTION
    PARENT_DELETE_GUARD
    PRIORITY_CASCADE
    TEAM_CASCADE
    BLOCKER_SAFETY_GUARD
    MEMBER_ASSIGNMENT_GUARD
    CASCADE_DELETE
    AUTO_NOTIFY
}

enum CriteriaOperator {
    EQUALS
    NOT_EQUALS
    GREATER_THAN
    LESS_THAN
}

type BehaviorSetting {
    id: ID!
    name: String!
    description: String!
    category: BehaviorCategory!
    defaultValue: Boolean!
}

type BehaviorSettingsCatalog {
    settings: [BehaviorSetting!]!
}

type BehaviorRule {
    id: ID!
    project: Project!
    name: String!
    isActive: Boolean!
    behaviorType: BehaviorType!
    fkTaskId: ID
    criteriaField: String
    criteriaOperator: CriteriaOperator
    criteriaValue: String
    actionMessage: String
    actionValue: String
    version: Int!
    createdAt: String!
    updatedAt: String
}

input CreateBehaviorRuleInput {
    projectId: ID!
    name: String!
    behaviorType: BehaviorType!
    isActive: Boolean
    fkTaskId: ID
    criteriaField: String
    criteriaOperator: CriteriaOperator
    criteriaValue: String
    actionMessage: String
    actionValue: String
}

input UpdateBehaviorRuleInput {
    name: String
    isActive: Boolean
    fkTaskId: ID
    criteriaField: String
    criteriaOperator: CriteriaOperator
    criteriaValue: String
    actionMessage: String
    actionValue: String
}

type DeleteBehaviorRulePayload {
    success: Boolean!
    deletedId: ID!
}

extend type Query {
    behaviorSettingsCatalog(projectId: ID!): BehaviorSettingsCatalog!
    behaviorRule(id: ID!): BehaviorRule
    behaviorRules(projectId: ID!): [BehaviorRule!]!
}

extend type Mutation {
    createBehaviorRule(input: CreateBehaviorRuleInput!): BehaviorRule!
    updateBehaviorRule(
        id: ID!
        version: Int!
        input: UpdateBehaviorRuleInput!
    ): BehaviorRule!
    deleteBehaviorRule(id: ID!): DeleteBehaviorRulePayload!
}
