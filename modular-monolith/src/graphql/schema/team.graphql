type Team {
    id: ID!
    name: String!
    projectId: ID!
    createdBy: String!
    creator: User
    createdAt: String!
    updatedAt: String
    version: Int!
    project: Project

    # Connections
    members(first: Int, after: String, last: Int, before: String): TeamMemberConnection!
    tasks(first: Int, after: String, last: Int, before: String): ProjectTaskConnection!
}

type TeamMember {
    id: ID!
    teamId: ID!
    userId: String!
    user: User
    team: Team
    createdAt: String!
    version: Int!
}

type TeamEdge {
    node: Team!
    cursor: String!
}

type TeamConnection {
    edges: [TeamEdge!]!
    pageInfo: PageInfo!
}

type TeamMemberEdge {
    node: TeamMember!
    cursor: String!
}

type TeamMemberConnection {
    edges: [TeamMemberEdge!]!
    pageInfo: PageInfo!
}

extend type Query {
    teams(projectId: ID!, first: Int, after: String, last: Int, before: String): TeamConnection!
    teamMembers(
        projectId: ID!
        teamId: ID!
        first: Int
        after: String
        last: Int
        before: String
    ): TeamMemberConnection!
}

extend type Mutation {
    createTeam(projectId: ID!, name: String!): CreateTeamPayload
    deleteTeams(projectId: ID!, teamIds: [ID!]!): DeleteTeamsPayload
    addTeamMembers(
        projectId: ID!
        teamId: ID!
        userIds: [String!]!
    ): AddTeamMembersPayload
    removeTeamMembers(
        projectId: ID!
        teamId: ID!
        userIds: [String!]!
    ): RemoveTeamMembersPayload
}

type CreateTeamPayload {
    success: Boolean!
    team: Team
}

type DeleteTeamsPayload {
    success: Boolean!
    deletedCount: Int!
    project: Project
}

type AddTeamMembersPayload {
    success: Boolean!
    team: Team
}

type RemoveTeamMembersPayload {
    success: Boolean!
    team: Team
}
