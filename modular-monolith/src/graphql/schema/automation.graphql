type AutomationRule {
  id: ID!
  projectId: ID!
  actorId: String!
  targetScope: String!
  taskId: ID
  teamId: ID
  rules: String!
  isActive: Boolean!
  createdAt: String!
  updatedAt: String
}

type AutomationRuleEdge {
  node: AutomationRule!
  cursor: String!
}

type AutomationRuleConnection {
  edges: [AutomationRuleEdge!]!
  pageInfo: PageInfo!
}

extend type Query {
  automations(projectId: ID, actorId: ID, taskId: ID, teamId: ID, targetScope: String, first: Int, after: String): AutomationRuleConnection!
}

extend type Mutation {
  addAutomation(projectId: ID!, targetScope: String!, taskId: ID, teamId: ID, rules: String!, isActive: Boolean): AutomationRule
  updateAutomation(automationId: ID!, targetScope: String, taskId: ID, teamId: ID, rules: String, isActive: Boolean): AutomationRule
  deleteAutomation(automationId: ID!): Boolean
}
