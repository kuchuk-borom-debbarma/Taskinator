# ─────────────────────────────────────────────
# Autopilot
# ─────────────────────────────────────────────

"""
A JSON blob. Represented as a scalar for flexibility.
"""
scalar JSON

"""
A condition node that forms the condition tree for an autopilot.
"""
union ConditionNode = AndNode | OrNode | NotNode | PredicateNode

type AndNode {
    children: [ConditionNode!]!
}

type OrNode {
    children: [ConditionNode!]!
}

type NotNode {
    child: ConditionNode!
}

type PredicateNode {
    domain: String!
    field: String!
    operator: String!
    value: JSON!
}

"""
A condition step in the pipeline.
"""
type AutopilotCondition {
    id: ID!
    name: String
    definition: ConditionNode!
}

"""
A single action step in an autopilot's execution chain.
"""
type AutopilotAction {
    id: ID!
    type: String!
    params: JSON!
}

"""
A step in the autopilot pipeline.
"""
union PipelineStep = AutopilotCondition | AutopilotAction

"""
An automated rule that triggers a sequence of actions when conditions are met.
"""
type Autopilot {
    """
    Unique identifier for the autopilot.
    """
    id: ID!

    """
    The project this autopilot belongs to.
    """
    fk_project_id: ID!

    """
    List of event types this autopilot listens to (e.g., ["task.updated"]).
    """
    triggers: [String!]!

    """
    Whether this autopilot is currently active.
    """
    isActive: Boolean!

    """
    The ordered sequence of conditions and actions.
    """
    pipeline: [PipelineStep!]!

    """
    ISO 8601 creation timestamp.
    """
    createdAt: String!

    """
    Optimistic-concurrency version counter.
    """
    version: Int!
}

"""
Metadata for building autopilots.
"""
type AutopilotMetadata {
    entities: [AutopilotEntityMetadata!]!
}

type AutopilotEntityMetadata {
    type: String!
    fields: [AutopilotFieldMetadata!]!
    actions: [AutopilotActionMetadata!]!
}

type AutopilotFieldMetadata {
    name: String!
    type: String!
    operators: [String!]!
}

type AutopilotActionMetadata {
    type: String!
    parameters: JSON!
}

"""
Relay-style paginated list of autopilots.
"""
type AutopilotConnection {
    edges: [AutopilotEdge!]!
    pageInfo: PageInfo!
    """
    Total number of autopilots matching the query, regardless of pagination.
    """
    totalCount: Int!
}

type AutopilotEdge {
    node: Autopilot!
    cursor: String!
}

extend type Query {
    """
    Fetches a paginated list of autopilots for a given project.
    Requires the caller to be a member of the project.
    """
    autopilots(
        projectId: ID!
        first: Int
        after: String
        last: Int
        before: String
    ): AutopilotConnection!

    """
    Returns metadata for autopilot discovery (fields, operators, actions).
    """
    autopilotMetadata(entityType: String!): AutopilotMetadata!
}

# --- Inputs ---

"""
Input structure to create a new autopilot rule.
"""
input CreateAutopilotInput {
    projectId: ID!
    triggers: [String!]!
    pipeline: [PipelineStepInput!]!
}

"""
Input structure to update an existing autopilot rule.
"""
input UpdateAutopilotInput {
    triggers: [String]
    isActive: Boolean
    pipeline: [PipelineStepInput!]
}

"""
Input for a single step in the pipeline.
"""
input PipelineStepInput {
    condition: AutopilotConditionInput
    action: AutopilotActionInput
}

"""
Input for an individual autopilot condition.
"""
input AutopilotConditionInput {
    name: String
    definition: ConditionNodeInput!
}

"""
Input for an individual autopilot action.
"""
input AutopilotActionInput {
    type: String!
    params: JSON!
}

"""
Input for a recursive condition node.
"""
input ConditionNodeInput {
    and: AndNodeInput
    or: OrNodeInput
    not: NotNodeInput
    predicate: PredicateNodeInput
}

input AndNodeInput {
    children: [ConditionNodeInput!]!
}
input OrNodeInput {
    children: [ConditionNodeInput!]!
}
input NotNodeInput {
    child: ConditionNodeInput!
}
input PredicateNodeInput {
    domain: String!
    field: String!
    operator: String!
    value: JSON!
}

extend type Mutation {
    """
    Creates an autopilot and its associated action pipeline.
    Requires user authentication.
    """
    createAutopilot(input: CreateAutopilotInput!): Autopilot!

    """
    Updates an existing autopilot rule.
    """
    updateAutopilot(id: ID!, input: UpdateAutopilotInput!): Autopilot!

    """
    Activates or deactivates an autopilot rule.
    Requires user authentication.
    """
    toggleAutopilot(id: ID!, isActive: Boolean!): Autopilot!

    """
    Deletes an autopilot rule.
    """
    deleteAutopilot(id: ID!): Boolean!
}
