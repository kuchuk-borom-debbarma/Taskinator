services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: taskinator-postgres-e2e
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    ports:
      - "5435:5432" # E2E mapped to 5435 to avoid conflict with dev 5434

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d test" ]
      interval: 5s
      timeout: 5s
      retries: 5
    # Use tmpfs for postgres data directory in E2E to dramatically speed up tests
    tmpfs:
      - /var/lib/postgresql/data

  kafka-e2e:
    image: bitnamilegacy/kafka:3.7
    container_name: taskinator-kafka-e2e
    ports:
      - "9094:9092" # E2E mapped to 9094 to avoid conflict with dev 9092
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9094
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@taskinator-kafka-e2e:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    tmpfs:
      - /bitnami/kafka

  redis-e2e:
    image: redis:7-alpine
    container_name: taskinator-redis-e2e
    ports:
      - "6380:6379" # E2E mapped to 6380 to avoid conflict with dev 6379
    tmpfs:
      - /data
